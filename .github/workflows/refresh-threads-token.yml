name: 쓰레드 토큰 자동 연장

on:
  schedule:
    - cron: "23 1 1,15 * *"   # 매달 1일·15일 오전 10:23(KST)에 60일 연장
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 연장 후 금고에 다시 저장
        env:
          OLD: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "SECRETS_PAT 없음 → 금고 업데이트 불가"; exit 1; fi
          RES=$(curl -sS -G "https://graph.threads.net/refresh_access_token" \
                  --data-urlencode "grant_type=th_refresh_token" \
                  --data-urlencode "access_token=$OLD")
          NEW=$(echo "$RES" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$NEW" ]; then
            echo "연장 실패: $(echo "$RES" | python3 -c "import sys,json; print(json.load(sys.stdin).get('error',{}).get('message','알 수 없음'))")"
            exit 1
          fi
          echo "::add-mask::$NEW"
          gh secret set THREADS_TOKEN --repo "$REPO" --body "$NEW"
          echo "쓰레드 토큰 연장 완료 (60일)"
